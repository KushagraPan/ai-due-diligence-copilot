text_punctuation:
  "0x0085":
    glyph: "..."
    note: "CP1252 horizontal ellipsis"
  "0x0091":
    glyph: "'"
    note: "CP1252 left single quotation mark"
  "0x0092":
    glyph: "'"
    note: "CP1252 right single quotation mark / apostrophe"
  "0x0093":
    glyph: '"'
    note: "CP1252 left double quotation mark"
  "0x0094":
    glyph: '"'
    note: "CP1252 right double quotation mark"
  "0x0095":
    glyph: "•"
    note: "CP1252 bullet"
  "0x0096":
    glyph: "–"
    note: "CP1252 en dash (preserved for ranges and accounting nil markers)"
  "0x0097":
    glyph: "—"
    note: "CP1252 em dash (preserved for prose parentheticals and accounting nil markers)"
  "0x2018":
    glyph: "'"
    note: "Unicode left single quotation mark"
  "0x2019":
    glyph: "'"
    note: "Unicode right single quotation mark / apostrophe"
  "0x201C":
    glyph: '"'
    note: "Unicode left double quotation mark"
  "0x201D":
    glyph: '"'
    note: "Unicode right double quotation mark"
  "0x2013":
    glyph: "–"
    note: "Unicode en dash (preserved for ranges and accounting nil markers)"
  "0x2014":
    glyph: "—"
    note: "Unicode em dash (preserved for prose parentheticals and accounting nil markers)"
  "0x2026":
    glyph: "..."
    note: "Unicode horizontal ellipsis"
