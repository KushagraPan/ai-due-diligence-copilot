# Versioned Symbol Font & Smart Punctuation Mappings
#
# NOTE ON MAPPING PROVENANCE & SCHEMA DESIGN:
# 1. `symbol_fonts` entries carry `confirmed_from` and `confirmed_on` because symbol font
#    codepoint-to-glyph assignments are empirical findings from specific filings that vary
#    by issuer and design software. This is a living mapping that grows across batches.
# 2. `text_punctuation` entries intentionally omit `confirmed_from`/`confirmed_on` because
#    they represent standard invariant specifications (Windows-1252 bytes 0x80-0x9F and
#    Unicode General Punctuation U+2000-U+206F), rather than document-specific discoveries.
# 3. Distinct en-dash ('–') and em-dash ('—') are preserved to prevent semantic conflation
#    between negative numbers, compound words, and accounting 'nil/not disclosed' indicators.
#    A downstream heuristic flags standalone dashes as '[NIL/NOT DISCLOSED]' pending Phase 1 Task 3
#    structured table extraction.

symbol_fonts:
  wingdings:
    "0x0079":
      glyph: "• "
      confirmed_from: "hdfc-bank_fy2025-26.pdf"
      confirmed_on: "2026-09-25"
